name: Bug report / 问题反馈
description: Report a reproducible desk interaction problem.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: Please omit pairing keys, credentials, clipboard contents and private logs.
  - type: input
    id: systems
    attributes:
      label: Systems and version
      placeholder: Windows 11 x64 + Apple Silicon macOS, LinkBridge 0.0.1
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: Screen layout and scaling
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Receiving-side evidence (redacted)
